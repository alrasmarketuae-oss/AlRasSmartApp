# nginx alternative to public/web.config, for serving shop.alrasmarketapp.com from the VPS
# next to the API container (upload `dist/` to /var/www/shop).

server {
    listen 80;
    server_name shop.alrasmarketapp.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name shop.alrasmarketapp.com;

    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    root /var/www/shop;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    location = /sitemap.xml {
        proxy_pass http://api:8080/api/seo/sitemap.xml;
        proxy_set_header Host api.alrasmarketapp.com;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Product pages: server-rendered SEO HTML (same SPA shell, so the app still boots).
    location ~ "^/product/(?<pid>[0-9a-fA-F-]{36})(/(?!order$|offer$)[^/]+)?/?$" {
        proxy_pass http://api:8080/api/seo/product/$pid;
        proxy_set_header Host api.alrasmarketapp.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors off;
    }

    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
