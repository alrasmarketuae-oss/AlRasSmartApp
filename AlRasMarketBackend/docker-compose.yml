services:
  api:
    build:
      context: .
      dockerfile: RasAlSouqPresentaionLayer/Dockerfile
    container_name: alras-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: "${DB_CONNECTION}"
      Redis__Enabled: "true"
      Redis__ConnectionString: "redis:6379"
      Redis__InstanceName: "alras:"
      Qdrant__Url: "http://qdrant:6333"
      Qdrant__Collection: "product_images_clip_v2"
      Qdrant__VectorSize: "512"
      Qdrant__MinScore: "0.75"
      Qdrant__ScoreClusterWindow: "0.03"
      Qdrant__MaxResults: "12"
      ImageEmbedding__Enabled: "true"
      ImageEmbedding__ClipServiceUrl: "http://clip:8088"
      ImageEmbedding__EmbeddingDimensions: "512"
      ImageEmbedding__MaxConcurrentIndexingJobs: "2"
    depends_on:
      - redis
      - qdrant
      - clip
    networks:
      - alras
    expose:
      - "8080"

  redis:
    image: redis:7-alpine
    container_name: alras-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - alras
    expose:
      - "6379"

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: alras-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - alras
    expose:
      - "6333"

  clip:
    build:
      context: ./clip-service
      dockerfile: Dockerfile
    container_name: alras-clip
    restart: unless-stopped
    environment:
      CLIP_MODEL: sentence-transformers/clip-ViT-B-32-multilingual-v1
      CLIP_IMAGE_MODEL: sentence-transformers/clip-ViT-B-32
    volumes:
      # Cache HuggingFace model so restarts do not re-download
      - clip_models:/root/.cache/huggingface
    networks:
      - alras
    expose:
      - "8088"

  nginx:
    image: nginx:1.27-alpine
    container_name: alras-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/alras.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - alras

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: alras-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      - redis
    networks:
      - alras
    expose:
      - "9121"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: alras-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - redis-exporter
    networks:
      - alras
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: alras-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-changeme}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://127.0.0.1:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - alras
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  redis_data:
  qdrant_data:
  clip_models:
  prometheus_data:
  grafana_data:

networks:
  alras:
    driver: bridge
