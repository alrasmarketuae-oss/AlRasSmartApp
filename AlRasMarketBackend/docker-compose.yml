services:
  api:
    build:
      context: .
      dockerfile: RasAlSouqPresentaionLayer/Dockerfile
    container_name: alras-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: "${DB_CONNECTION}"
      Redis__Enabled: "true"
      Redis__ConnectionString: "redis:6379"
      Redis__InstanceName: "alras:"
      Qdrant__Url: "http://qdrant:6333"
      Qdrant__Collection: "product_images_clip_v2"
      Qdrant__VectorSize: "512"
      Qdrant__MinScore: "0.75"
      Qdrant__ScoreClusterWindow: "0.03"
      Qdrant__MaxResults: "12"
      AiAssistant__Enabled: "true"
      AiAssistant__QdrantUrl: "http://qdrant:6333"
      AiAssistant__Collection: "alras_knowledge_v3"
      AiAssistant__EmbeddingModel: "text-embedding-3-small"
      AiAssistant__EmbeddingDimensions: "1536"
      AiAssistant__ChatModel: "gpt-4o-mini"
      AiAssistant__RetrievalLimit: "6"
      AiAssistant__MinScore: "0.35"
      ImageEmbedding__Enabled: "true"
      ImageEmbedding__ClipServiceUrl: "http://clip:8088"
      ImageEmbedding__EmbeddingDimensions: "512"
      ImageEmbedding__MaxConcurrentIndexingJobs: "1"
      AdAutoModeration__Enabled: "true"
      AdAutoModeration__MaxImagesToScan: "0"
      Meilisearch__Enabled: "true"
      Meilisearch__Url: "http://meilisearch:7700"
      Meilisearch__ApiKey: "${MEILI_MASTER_KEY:-alras-meili-master-key-change-me}"
      Meilisearch__IndexUid: "products"
      Meilisearch__BootstrapOnStartup: "true"
      EmailSettings__PublicBaseUrl: "https://api.alrasmarketapp.com"
      CloudflareR2__PublicBaseUrl: "https://cdn.alrasmarketapp.com"
      # Google: Web + iOS OAuth client IDs (idToken audience). Apple: iOS bundle id.
      ExternalAuth__Google__ClientIds: "${GOOGLE_CLIENT_IDS:-592516755028-omkgbtoesqbj89g1ds07h6jqu4r7979i.apps.googleusercontent.com,592516755028-8482cm2q52e83uv9h8t9a2oh6jjtoaab.apps.googleusercontent.com}"
      ExternalAuth__Apple__ClientIds: "${APPLE_CLIENT_IDS:-com.mergespice.alrasmarket}"
    depends_on:
      - redis
      - qdrant
      - clip
      - meilisearch
    networks:
      - alras
    expose:
      - "8080"

  redis:
    image: redis:7-alpine
    container_name: alras-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - alras
    expose:
      - "6379"

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: alras-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - alras
    expose:
      - "6333"

  clip:
    build:
      context: ./clip-service
      dockerfile: Dockerfile
    container_name: alras-clip
    restart: unless-stopped
    environment:
      CLIP_MODEL: sentence-transformers/clip-ViT-B-32-multilingual-v1
      CLIP_IMAGE_MODEL: sentence-transformers/clip-ViT-B-32
    volumes:
      # Cache HuggingFace model so restarts do not re-download
      - clip_models:/root/.cache/huggingface
    networks:
      - alras
    expose:
      - "8088"

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: alras-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:-alras-meili-master-key-change-me}"
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    networks:
      - alras
    expose:
      - "7700"

  nginx:
    image: nginx:1.27-alpine
    container_name: alras-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/alras.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - alras

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: alras-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      - redis
    networks:
      - alras
    expose:
      - "9121"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: alras-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - redis-exporter
    networks:
      - alras
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: alras-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-changeme}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://127.0.0.1:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - alras
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  redis_data:
  qdrant_data:
  clip_models:
  meili_data:
  prometheus_data:
  grafana_data:

networks:
  alras:
    driver: bridge
