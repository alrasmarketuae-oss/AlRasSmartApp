server {
    listen 80;
    server_name api.alrasmarketapp.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Reflect browser Origin on error pages so landing/dashboard don't see a false CORS failure
# when upstream times out (common during email OTP send).
map $http_origin $cors_allow_origin {
    default "";
    "~*^https://([a-z0-9-]+\.)?alrasmarketapp\.com$" $http_origin;
    "~*^https://([a-z0-9-]+\.)?alrasmarket\.com$" $http_origin;
    "~*^http://localhost(:[0-9]+)?$" $http_origin;
    "~*^http://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
    "~*^http://192\.168\.[0-9]+\.[0-9]+(:[0-9]+)?$" $http_origin;
    "~*^https://.*\.netlify\.app$" $http_origin;
    "~*^https://([a-z0-9-]+\.)?pages\.dev$" $http_origin;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.alrasmarketapp.com;

    # Cloudflare Origin CA (preferred) or self-signed fallback — see deploy/ssl/
    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # During API redeploys nginx otherwise returns a raw HTML 502 that Flutter shows
    # as a huge error. Intercept and return a short JSON message the app already reads.
    error_page 502 503 504 =503 /api_busy.json;

    location = /api_busy.json {
        internal;
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Vary "Origin" always;
        return 503 '{"message":"Sorry, we are receiving high demand right now. Please try again in a few seconds."}';
    }

    location ~ ^/(aivoicehub|chathub|aihub|adminhub) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_intercept_errors on;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # Auth registration + OTP can wait on SMTP; give them a longer upstream budget.
    location ~ ^/api/Auth/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 10M;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 5s;
        proxy_intercept_errors on;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 100M;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_intercept_errors on;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
