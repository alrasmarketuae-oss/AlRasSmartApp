name: alrasmarket
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.20+21

environment:
  sdk: ^3.10.8

  
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter 
    

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.0
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.3
  get_it: ^9.2.0
  go_router: ^17.0.1
  image_picker: ^1.2.1
  image_picker_android: ^0.8.13+16
  image_picker_platform_interface: ^2.11.1
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  fluttertoast: ^8.2.4
  
  carousel_slider: ^5.1.1
  # Authentication
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^7.0.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  http: ^1.2.2
  intl_phone_field_v2: ^4.0.2

    # Firebase
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.0.0
  pinput: ^6.0.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  file_picker: ^11.0.2
  signalr_netcore: ^1.4.4
  record: ^6.0.0
  audioplayers: ^6.4.0
  path_provider: ^2.1.5
  path: ^1.9.1
  video_player: ^2.11.1
  http_parser: ^4.1.2
  ffmpeg_kit_flutter_new: ^4.2.1
  flutter_image_compress: ^2.4.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image_cropper: ^9.0.0
  flutter_secure_storage: ^9.2.4
  pointycastle: ^3.9.1
  convert: ^3.1.2
  crypto: ^3.0.6
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  intl_utils: ^2.8.14

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:


  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/logo/
    - assets/icons/
    - assets/images/
    - assets/sounds/

    - assets/nav_bar_icons/
    - assets/home_icons/
    - assets/services_icons/
    - assets/images/categories/
    - assets/logo/
    - assets/profile_icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo/Cairo-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
    

flutter_intl:
  enabled: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/appplogo.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo/splash.png
  android_12:
    color: "#FFFFFF"
    image: assets/logo/splash.png
  android: true
  ios: true
  web: false
