org.gradle.jvmargs=-Xmx4G -Dhttps.protocols=TLSv1.2 -Djdk.tls.client.protocols=TLSv1.2
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.offline=false
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.tentatives=10
systemProp.org.gradle.internal.repository.max.backoff=5000
systemProp.https.protocols=TLSv1.2
systemProp.http.keepAlive=false
android.useAndroidX=true
# Local aapt2 binary — avoids TLS failures downloading aapt2 from Google Maven.
android.aapt2FromMavenOverride=C:\\src\\gradle-mirror\\aapt2-bin\\aapt2.exe
# Prevent R8 from stripping FFmpegKit JNI bindings in release builds
android.enableR8.fullMode=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Pub cache is on C: while the project is on D:; Kotlin incremental caches
# fail with "this and base files have different roots".
kotlin.incremental=false
kotlin.incremental.android=false
kotlin.incremental.js=false
